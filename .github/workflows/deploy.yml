# Build the site and publish it on GitHub Pages.
# Runs on every push to main (including saves from Pages CMS), once a day so that job ads drop off
# after their deadline, and on demand from the Actions tab.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional repository variables (Settings → Secrets and variables → Actions → Variables).
      # Empty means the defaults: https://koplev-lab.github.io served at /.
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24 # keep in step with .nvmrc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
