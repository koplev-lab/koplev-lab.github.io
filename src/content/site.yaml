labName: Koplev Lab
tagline: We develop computational and statistical methods to map how cells are arranged in human tissues, and how that arrangement changes in inflammation, cancer and cardiovascular disease.
piName: Simon Koplev
description: Computational biology group in the Department of Gene Technology at KTH and at SciLifeLab in Stockholm. We develop machine learning and statistical methods for single-cell and spatial omics to study tissue architecture in health and disease.
